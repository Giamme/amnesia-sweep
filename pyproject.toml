[project]
name = "amnesia-sweep"
version = "0.1.0"
description = "See what AI coding agents left on disk, then delete it or archive it for later."
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

[tool.amnesia-sweep]
# Standard library only. No runtime dependencies, deliberately: this tool deletes
# things, so everything it does should be readable in this repo.
stdlib-only = true
